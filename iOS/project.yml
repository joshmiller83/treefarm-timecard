# Generate TimeCard.xcodeproj with `xcodegen generate` (brew install xcodegen), run in this folder.
# The generated project is committed too, so XcodeGen is only needed to change targets or settings.
name: TimeCard
options:
  deploymentTarget:
    # 18.0 for the Live Activity's watch (small) layout; the same iPhones as iOS 17.
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Colors are read through Palette (App/Design), so Xcode's generated asset symbols would clash.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
packages:
  TimeCardCore:
    path: TimeCardCore
  # The same path TimeCardCore uses, so SwiftPM sees one package. The watch targets link
  # only TreeFarmKit (TimeCardCore needs GRDB and doesn't build for watchOS).
  TreeFarmKit:
    path: ../Packages/TreeFarmKit
targets:
  TimeCard:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/Fonts/**"
          - "Watch/**"
      # A folder reference keeps each font next to its OFL.txt inside the app bundle.
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
      # Synced folders: files added here build without regenerating the project.
      - path: App/Watch
        type: syncedFolder
      - Shared
      # The WatchConnectivity transport, compiled into the iPhone and watch apps.
      - path: WatchLink
        type: syncedFolder
      # The Live Activity's small (Smart Stack) layout, also built into the app so its tests can render it.
      - Widgets/LiveActivitySmall.swift
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Time Card
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Siri sometimes hears the app's name differently.
        INAlternativeAppNames:
          - INAlternativeAppName: Tree Card
          - INAlternativeAppName: Tree Farm
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: Time Card shows the heart rate, calories, steps and distance from your shifts. They stay on your iPhone and Apple Watch and are never sent to the farm.
        NSHealthUpdateUsageDescription: Time Card saves each shift as a Tree care workout (Other in Health), paused during lunch and breaks, with its route when you turn on Record route.
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        TimeCardAppGroup: group.$(BUNDLE_ID_PREFIX).timecard
        UIAppFonts:
          - Fonts/ZillaSlab/ZillaSlab-SemiBold.ttf
          - Fonts/ZillaSlab/ZillaSlab-Bold.ttf
          - Fonts/IBMPlexMono/IBMPlexMono-Medium.ttf
          - Fonts/IBMPlexMono/IBMPlexMono-SemiBold.ttf
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).sync
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: Bg
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/TimeCard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).timecard
        # The phone starts the watch's shift workout (HKHealthStore.startWatchApp) and reads a
        # shift's steps, distance and heart rate for its Health card (docs/health.md 4).
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_NAME: TimeCard
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).timecard
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: TimeCardWidgets
      # Embed Watch Content: TimeCard.app/Watch/TimeCardWatch.app
      - target: TimeCardWatch
      - package: TimeCardCore
      - sdk: WatchConnectivity.framework
      - sdk: HealthKit.framework
  TimeCardWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Time Card
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TimeCardAppGroup: group.$(BUNDLE_ID_PREFIX).timecard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/TimeCardWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).timecard
    settings:
      base:
        PRODUCT_NAME: TimeCardWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).timecard.widgets
        SKIP_INSTALL: YES
        # Shared intents run in the app; in the extension their perform() compiles empty.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
    dependencies:
      - package: TimeCardCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
  TimeCardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "Watch/**"
      - path: Tests/Watch
        type: syncedFolder
    dependencies:
      - target: TimeCard
      - package: TreeFarmKit
        product: TreeFarmKitTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).timecard.tests
        GENERATE_INFOPLIST_FILE: YES
  TimeCardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: TimeCard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).timecard.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TimeCard
  TimeCardWatch:
    type: application
    platform: watchOS
    sources:
      # Synced folders: files added here build without regenerating the project.
      - path: Watch/App
        type: syncedFolder
      - path: Watch/Shared
        type: syncedFolder
      - path: WatchLink
        type: syncedFolder
    info:
      path: Watch/App/Info.plist
      properties:
        CFBundleDisplayName: Time Card
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        INAlternativeAppNames:
          - INAlternativeAppName: Tree Card
          - INAlternativeAppName: Tree Farm
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).timecard
        WKRunsIndependentlyOfCompanionApp: false
        # Without it a shift's workout session dies when the app goes to the background.
        WKBackgroundModes:
          - workout-processing
        # Apple asks for it when an app plays haptics during a workout.
        UIBackgroundModes:
          - audio
        # Tapping the iPhone's Live Activity in the Smart Stack opens this app (watchOS 11.1+).
        WKSupportsLiveActivityLaunchAttributeTypes:
          - TimeCardActivityAttributes
        # Only with Record route on, and only while a Tree care workout runs (docs/health.md 3).
        NSLocationWhenInUseUsageDescription: Time Card records your route during a Tree care workout when you turn on Record route. It stays in Health and is never sent to the farm.
        NSHealthShareUsageDescription: Time Card shows the heart rate, calories, steps and distance from your shifts. They stay on your iPhone and Apple Watch and are never sent to the farm.
        NSHealthUpdateUsageDescription: Time Card saves each shift as a Tree care workout (Other in Health), paused during lunch and breaks, with its route when you turn on Record route.
        TimeCardAppGroup: group.$(BUNDLE_ID_PREFIX).timecard
    entitlements:
      path: Watch/App/TimeCardWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).timecard
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        # Watch values live at target level: XcodeGen's platform presets override project ones.
        PRODUCT_NAME: TimeCardWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).timecard.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        # A single-size 1024 watchOS icon in Watch/App/Resources/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      # Embed Foundation Extensions: TimeCardWatch.app/PlugIns/TimeCardWatchWidgets.appex
      - target: TimeCardWatchWidgets
      - package: TreeFarmKit
        product: TreeFarmKit
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
  TimeCardWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Watch/Widgets
        type: syncedFolder
      - path: Watch/Shared
        type: syncedFolder
    info:
      path: Watch/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Time Card
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TimeCardAppGroup: group.$(BUNDLE_ID_PREFIX).timecard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Watch/Widgets/TimeCardWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).timecard
    settings:
      base:
        PRODUCT_NAME: TimeCardWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).timecard.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    dependencies:
      - package: TreeFarmKit
        product: TreeFarmKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  TimeCardWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: WatchTests
        type: syncedFolder
    dependencies:
      - target: TimeCardWatch
      - package: TreeFarmKit
        product: TreeFarmKitTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).timecard.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  TimeCardWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchUITests
        type: syncedFolder
    dependencies:
      - target: TimeCardWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).timecard.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TimeCardWatch
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  TimeCard:
    build:
      targets:
        TimeCard: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TimeCardTests
        - TimeCardUITests
    archive:
      config: Release
  TimeCardWatch:
    build:
      targets:
        TimeCardWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TimeCardWatchTests
        - TimeCardWatchUITests
    archive:
      config: Release
